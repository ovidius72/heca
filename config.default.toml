# heca — Default Config
# ======================
# This file holds heca's DEFAULT, non-keybinding configuration. It is embedded
# into the binary and parsed at startup, so every value below is always valid and
# complete by construction. Keybindings live in a separate file:
# `keybindings.default.toml`.
#
# To customize: copy this file to ~/.config/heca/config.toml (Linux/macOS) or
# %APPDATA%\heca\config.toml (Windows) and change only what you need. Anything you
# omit falls back to the default shown here, so a minimal config is perfectly fine.
# Your config is deep-merged over these defaults (tables merge per-key; arrays are
# replaced wholesale).
#
# Color values are "#rrggbb" (or "#rrggbbaa" where alpha is supported).

# ─────────────────────────────────────────────────────────────────────────────
[settings]
# ─────────────────────────────────────────────────────────────────────────────

# Color theme by name. Built-ins: "grid_tron" (default), "grid_ares", "mocha",
# "latte". A theme only sets colors/effects — never fonts (see [font]).
theme = "grid_tron"

# Enable mouse support (selection, click-to-focus, drag-to-move panes).
mouse = true

# Initial window size in logical pixels.
window_width = 1280
window_height = 800

# Auto-scroll the workspace view when the pointer nears the left/right edge.
auto_scroll_edge = true

# Center a single column even when it already fits in the viewport.
always_center_single_column = false

# Modifier held to start an interactive pane drag with the mouse.
# One of: "Super" (default) | "Alt" | "Ctrl" | "Shift".
interactive_move_modifier = "Super"

# Auto-inject shell hooks that emit OSC 133 / OSC 7 for per-command status and
# cwd updates. Disable to spawn a bare shell instead.
shell_integration = true

# Host terminal scrollback capacity in rows (history retained above the
# visible viewport). The host scrollback viewport scrolls within this range.
# Mirrors wezterm-term's default of 3500 when unset.
terminal_scrollback_lines = 3500

# Terminal color palette overrides (all optional → fall back to the theme).
# terminal_foreground          = "#c6f0ff"
# terminal_background          = "#060a0e"
# terminal_cursor_foreground   = "#060a0e"
# terminal_cursor_background    = "#40e0ff"
# terminal_cursor_border       = "#40e0ff"
# terminal_selection_foreground = "#ffffff"
# terminal_selection_background = "#234"
# ANSI 0..7 (black,red,green,yellow,blue,magenta,cyan,white):
# terminal_ansi    = ["#000000","#ff4654","#50ffaa","#ffbe46","#40e0ff","#b48cff","#5ff","#c6f0ff"]
# Bright ANSI 8..15:
# terminal_brights = ["#444","#ff6b78","#7dffc0","#ffd27a","#7fe9ff","#cdb0ff","#9ff","#ffffff"]

# ─────────────────────────────────────────────────────────────────────────────
[font]
# ─────────────────────────────────────────────────────────────────────────────
# Fonts are decoupled from the color theme (system-local), so a theme never
# requires a specific installed font. Defaults: UI = Geist Mono 15.0, terminal =
# Maple Mono Normal NF 14.0 — both embedded, so they resolve without a system
# install. `bold`/`italic`/`bold_italic` are optional; unset falls back to
# `normal` and the renderer selects the face via weight/style.

[font.family.ui]
# normal      = "Geist Mono"
# bold        = "..."   # optional → falls back to normal
# italic      = "..."   # optional → falls back to normal + synthesized oblique
# bold_italic = "..."   # optional → falls back to italic → bold → normal

[font.family.terminal]
# normal = "Maple Mono Normal NF"
# italic = "..."        # optional distinct italic family

[font.size]
# ui       = 15.0
# terminal = 14.0

# ═════════════════════════════════════════════════════════════════════════════
#  APPEARANCE
# ═════════════════════════════════════════════════════════════════════════════
# Layout:
#   [appearance]          → app-wide knobs + GLOBAL border defaults
#   [appearance.terminal] → terminal CONTENT translucency/blur
#   [appearance.pane]     → pane FRAME (border/radius/gap/padding) + info bar
#   [appearance.sidebar]  → sidebar shell frame + background
#
# Inheritance for the border fields: a surface value (e.g. [appearance.pane]
# border_width) wins; if unset it falls back to the GLOBAL [appearance]
# border_width; if that is unset too, the active theme decides. So you set a value
# once at [appearance] and every surface follows, or override per surface.
#
# Numeric "amount" knobs (transparency/blur) are 0..=100; 0 = off (default).
# Lengths (border_width, *_radius, gap, padding, width) are in logical pixels.

[appearance]
# ── Window / app-wide translucency + frost ──
# transparency : how see-through the WHOLE app is (0 opaque … 100 transparent).
# blur         : in-app frosted-glass blur behind translucent panels (palette,
#                sidebar). Our own GPU pass; 0 = off.
transparency = 0
blur = 0

# z=0 background layer — heca's own frosted gradient drawn as the bottom-most
# layer that panes composite over (cross-platform frost, no OS vibrancy needed).
# background_blur         : gradient blur strength (0 sharp … 100 max).
# background_transparency : 0 opaque (default) … 100 see-through to the desktop.
background_blur = 0
background_transparency = 0
# Optional gradient color overrides (unset → theme.background + a darker shade):
# background_gradient_top    = "#1e1e2e"
# background_gradient_bottom = "#181825"

# OS backdrop material (blurs the desktop BEHIND the window). Not portable:
# macOS NSVisualEffect materials, Windows acrylic/mica (best-effort), Linux no-op.
# One of: none (default) | sidebar | hud_window | under_window_background |
#         popover | menu | full_screen_ui | window_background
# vibrancy = "under_window_background"

# Effect tokens — override the theme; unset → inherit the theme value.
# glow_size : owns glow presence + halo radius + strength. none|thin|medium|large
# intensity : owns the scanline/CRT overlay opacity only. off|low|medium|heavy
# glow_size = "medium"
# intensity = "medium"

# ── GLOBAL border defaults (every surface inherits these when its own field is
#    unset; each then falls back to the theme) ──
# border_width  : decorative border width, px. The app-wide BORDER control. The
#                 chrome + every surface inherit it. 0 removes borders everywhere.
# border_color  : the `bordered` frame color (chrome + surfaces). Set to e.g. the
#                 accent for a bright, visible border. (The `bracketed` reticle
#                 always uses the theme accent.)
# border_radius : corner radius, px, inherited by surfaces.
# border_width  = 1.0
# border_color  = "#40e0ff"
# border_radius = 12.0
# Affordance outlines (keyboard focus ring + selected-item highlight) keep their
# OWN width so they stay visible even with borders off (default 1.5).
# focus_border_width = 1.5

# ─────────────────────────────────────────────────────────────────────────────
[appearance.terminal]
# ─────────────────────────────────────────────────────────────────────────────
# Translucency/blur of the terminal CONTENT surface (the pane frame lives under
# [appearance.pane]). All 0..=100; 0 = opaque/off.
# transparency          : tiled terminal-pane translucency (surface over z=0).
# floating_transparency : floating-pane translucency (independent of tiled, so
#                         floating panes can stay readable while tiled are frosted).
# floating_blur         : floating-pane real blur strength.
transparency = 0
floating_transparency = 0
floating_blur = 0

# ─────────────────────────────────────────────────────────────────────────────
[appearance.pane]
# ─────────────────────────────────────────────────────────────────────────────
# The tiled/floating pane FRAME + the in-pane info bar. Border fields unset →
# global [appearance] default → theme.
# border_style : frame decoration. none | bordered | bracketed. Default "bordered".
# border_width : frame width, px (0 = no border). Clamped [0, 10].
# border_color : inactive/unfocused frame color.
# border_radius: corner radius, px. Clamped [0, 20] (keeps the content clip gentle).
# active_border_color   : focused-pane frame color (default theme accent).
# floating_border_color : floating-pane frame color (default theme float accent).
# gap     : gap between tiled panes, px (default 8.0). NOTE: when the pane border
#           is visible (border_style != "none" and border_width > 0) the gap is
#           floored at the border width, because adjacent panes each draw a full
#           border on their shared edge — a smaller gap would make the two borders
#           overlap. So `gap = 0` with borders on becomes one border width (a clean
#           single divider); with border_style = "none", `gap = 0` is truly flush.
# padding : content inset from the frame, px (default 4.0). Clamped [0, 20].
# border_style          = "bordered"
# border_width          = 2.0
# border_color          = "#313244"
# border_radius         = 20.0
# active_border_color   = "#89b4fa"
# floating_border_color = "#89b4fa"
# gap                   = 8.0
# padding               = 4.0
#
# Info bar (segmented pill inside the pane top + action buttons on the right):
# title_segments : left side, in order. [] hides it.
#                  "location" | "app_name" | "git_branch" | "git_status"
#                  (a segment with no data for a pane — e.g. git outside a repo —
#                   is skipped). Default ["location", "app_name"].
# title_actions  : right side, in order. [] hides it.
#                  "split" | "close" | "zoom" | "float" | "move_left" | "move_right"
#                  Default ["split", "close"] (panes are already movable by drag).
#                  Each button's tooltip shows its real configured keybinding.
# Both empty ⇒ no bar and no reserved top padding.
# title_segments = ["location", "app_name"]
# title_actions  = ["split", "close"]

# ─────────────────────────────────────────────────────────────────────────────
[appearance.sidebar]
# ─────────────────────────────────────────────────────────────────────────────
# The sidebar shell (left + right), self-themeable independently of the panes.
# Border fields unset → global [appearance] default → theme.
# border_style    : none | bordered | bracketed. Default "bracketed".
#                   - "bordered"  → a clean frame in border_color at border_width.
#                   - "bracketed" → the accent corner-reticle (sized by
#                                   border_width + border_radius too).
# border_width    : frame width, px. 0 removes the border. Clamped [0, 10].
# border_color    : the `bordered` frame color.
# border_radius   : corner radius, px. Clamped [0, 40].
# background_color: shell fill (unset → theme sidebar surface). Transparency still
#                   applies on top.
# gap             : gap between the sidebar and the content area, px (default 12.0).
# width           : sidebar width, px. Clamped [160, 560] (default 300).
# border_style     = "bracketed"
# border_width     = 1.0
# border_color     = "#40e0ff"
# border_radius    = 12.0
# background_color = "#0b0f14"
# gap              = 12.0
# width            = 300

# ─────────────────────────────────────────────────────────────────────────────
# Program catalog — [program.<id>]
# ─────────────────────────────────────────────────────────────────────────────
# Maps running processes to a display name + icon + color (shown in the pane info
# bar / sidebar card). The entries below are the built-in defaults. Override one,
# add `processes = [...]` aliases, or `disabled = true` to drop a mapping.
#
# `icon` is a semantic Phosphor name, one of:
#   terminal | file_code | folder | folder_open | git_branch | gear | search
# Unknown programs fall back to their raw process name + the terminal icon.

# ── Shells (terminal icon, name falls back to the raw process) ──
[program.sh]
icon = "terminal"
[program.bash]
icon = "terminal"
[program.zsh]
icon = "terminal"
[program.fish]
icon = "terminal"

# ── Editors ──
[program.nvim]
name = "Neovim"
processes = ["v", "nvim"]
icon = "file_code"
color = "#89b4fa"

[program.vim]
name = "Vim"
processes = ["v", "vim"]
icon = "file_code"
color = "#a6e3a1"

[program.helix]
name = "Helix"
processes = ["helix"]
icon = "file_code"
color = "#a3be8c"

# ── File managers ──
[program.yazi]
name = "Yazi"
processes = ["yazi"]
icon = "folder_open"
color = "#74c7ec"

[program.ranger]
name = "Ranger"
processes = ["ranger"]
icon = "folder_open"
color = "#94e2d5"

# ── AI / agent CLIs ──
[program.claude]
name = "Claude"
processes = ["claude"]
icon = "terminal"

[program.codex]
name = "Codex"
processes = ["codex"]
icon = "terminal"

[program.opencode]
name = "OpenCode"
processes = ["opencode"]
icon = "terminal"

[program.pi]
name = "Pi"
processes = ["pi"]
icon = "terminal"
