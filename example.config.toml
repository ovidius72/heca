# heca Example Config
# ===================
# Copy this file to ~/.config/heca/config.toml (Linux/macOS) or
# %APPDATA%\heca\config.toml (Windows) and then adjust only what you need.

[settings]
# Auto-inject shell hooks that emit OSC 133 / OSC 7 for per-command status
# and cwd updates. Disable to spawn a bare shell instead.
shell_integration = true

# Fonts are configured in the dedicated [font] block below — they are
# system-local, NOT part of the color theme, so a theme never requires a
# specific installed font.

[font]
# Font families + sizes, decoupled from the color theme. `normal` is optional —
# if omitted, the surface falls back to its embedded font (Geist Mono for UI,
# Maple Mono Normal NF for terminal). `bold` / `italic` / `bold_italic` are
# optional — unset falls back to `normal` and the renderer selects the face via
# weight/style within the family.
# Defaults: UI = Geist Mono 15.0, terminal = Maple Mono Normal NF 14.0 (both
# embedded, so they resolve without a system install).

[font.family.ui]
# normal = "Geist Mono"
# bold = "..."        # optional → fall back to normal
# italic = "..."      # optional → fall back to normal + synthesized oblique
# bold_italic = "..." # optional → fall back to italic → bold → normal

[font.family.terminal]
# normal = "Maple Mono Normal NF"
# italic = "..."      # optional distinct italic family

[font.size]
# ui = 15.0
# terminal = 14.0

[appearance]
# Window / chrome transparency + blur (each 0..=100, default 0)
transparency = 0
blur = 0

# z=0 background layer — heca-owned frosted gradient (the bottom-most layer
# panes composite over). Cross-platform frost WITHOUT OS vibrancy: heca renders
# + blurs the gradient itself, so it works on Linux/Windows/macOS identically.
#   background_blur         = 0..=100  blur strength of the gradient (0 = sharp, 100 = max)
#   background_transparency  = 0..=100  0 = opaque gradient (default); >0 = translucent
#   background_gradient_top / _bottom  optional "#rrggbb" override; unset →
#                                       theme.background (top) + a derived darker shade (bottom)
background_blur = 0
background_transparency = 0
# background_gradient_top    = "#1e1e2e"
# background_gradient_bottom = "#181825"

# Migration: the old tiled-frost knobs `terminal_blur` and `terminal_frost_color`
# are REMOVED. Tiled frost is now the z=0 layer showing through the translucent
# terminal surface (`terminal_transparency` below) — use `background_blur` to
# drive frost strength. Floating panes keep their own real blur
# (`terminal_floating_blur`).

# Terminal-pane translucency (surface alpha over z=0).
# The tiled frost is owned by the z=0 background layer (`background_blur` /
# `background_transparency` below) — there is no per-terminal tiled blur knob.
terminal_transparency = 0

# Floating panes default to opaque + no real blur.
terminal_floating_transparency = 0
terminal_floating_blur = 0
# pane_floating_border_color = "#89b4fa"

# Platform backdrop material
# vibrancy = "under_window_background"

# Effect tokens (override the theme; unset → inherits the theme value).
# `glow_size` owns glow: presence + halo radius + strength.
#   none | thin | medium | large
# glow_size = "medium"
# `intensity` owns the scanline/CRT overlay opacity only; it does NOT affect glow.
#   off | low | medium | heavy
# intensity = "medium"

# Pane chrome
# pane_border_width = 2.0
# pane_border_radius = 20.0
# pane_padding = 4.0
# pane_border_color = "#313244"
# pane_active_border_color = "#89b4fa"
# pane_gap = 8.0
# sidebar_gap = 12.0
# sidebar_width = 300       # logical px; clamped to 160..=560 (default 300)

# Pane info bar (segmented pill inside the pane top + action buttons)
# Left side — segments, in order ([] hides them):
#   "location" | "app_name" | "git_branch" | "git_status"
# pane_title_segments = ["location", "app_name"]
# Right side — action buttons, in order ([] hides them):
#   "split" | "close" | "zoom" | "float" | "move_left" | "move_right"
# Default is split + close (panes are already movable by mouse drag); add
# "zoom"/"float"/"move_left"/"move_right" here for more buttons. Each button's
# tooltip shows its real configured keybinding.
# pane_title_actions  = ["split", "zoom", "float", "close"]
# Both empty ⇒ no bar and no reserved top padding.

[keys]
# Prefix key triggers prefix mode for all `prefix+...` bindings.
prefix = "ctrl+b"

[[keys.command]]
keys = "prefix+g"
command = "lazygit"
float = true
close_pane = true

[[keys.command]]
keys = "Alt+Enter"
command = "alacritty"
kind = "terminal"

# Built-in catalog entries are seeded in code for common shells plus:
# nvim, vim, helix, yazi, ranger, claude, codex, opencode, pi.
# Use `[program.<id>]` to override one, add aliases, or disable it cleanly.

[program.nvim]
name = "Neovim"
processes = ["v", "nvim"]
icon = "file_code"
description = "modal editor"
color = "#89b4fa"

# Remove a built-in entry and fall back to raw process name + terminal icon.
# [program.ranger]
# disabled = true

# Unknown programs fall back to their raw name and the default terminal icon.
