[package]
name = "heca-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The winit key adapter (`src/input.rs`) lives here because this is the one crate both surfaces —
# the app and the showcase — can share. It was a dev-dependency while only the example used winit;
# the app and the showcase each kept their own copy of "which `GridKey` is this platform key", and
# two copies of one table drift.
winit = { workspace = true }
heca-core = { path = "../heca-core" }
heca-config = { path = "../heca-config" }
heca-grid-ui = { path = "../heca-grid-ui" }
wgpu = { workspace = true }
cosmic-text = "0.19"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
heca-theme = { path = "../heca-theme" }
# Reads the embedded faces' cmap so `tests/font_coverage.rs` can prove every glyph the widgets name
# is actually in the font. Already in the tree (cosmic-text → fontdb → ttf-parser), so it adds a
# test, not a dependency.
ttf-parser = "0.25"
# The showcase renders a described tree beside its hand-built twin. Both crates sit below this one,
# which is the point of F003/P017/T009 — while `realize` was inside the `heca` binary no example
# could call it, so nothing declarative could be looked at outside the app.
heca-view = { path = "../heca-view" }
heca-view-realize = { path = "../heca-view-realize" }
csscolorparser = "0.6"
naga = { version = "25", features = ["wgsl-in"] }
pollster = { workspace = true }

[[example]]
name = "showcase"
path = "examples/showcase.rs"
