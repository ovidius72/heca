name = "Grid Tron"
background = "#060a0e"
surface = "#0c1218"
foreground = "#c6f0ff"
muted = "#608292"
border = "#00427c"
accent = "#29b4fa"
glow = "#29b4fa"
# The keyboard cursor: amber, the one hue far from this palette's cyan accent, so "where you
# are" never reads as a brighter "what is selected".
# A selected pane/row sits on a LIT PANEL rather than an accent tint, so the cursor's neon
# ring stays readable on top of it. Teal, the surface carried toward the cyan accent.
selected_background = "#185677"

# A selected row, the row back-and-forth returns to, and the two workspace frames —
# four strengths of one idea, as colours rather than alphas so they can simply be seen.
previous_background = "#164965"
workspace_active_background = "#102735"
workspace_previous_background = "#0e1f2a"
danger = "#ff4654"
success = "#50ffaa"
warning = "#ffbe46"
border_radius = 4.0
border_width = 2.0
pane_padding = 4.0
left_sidebar_background = "#05090d"
right_sidebar_background = "#05090d"
top_bottom_pane_background = "#04080c"
background_gradient_top = "#1a2c3a"
background_gradient_bottom = "#0c1820"
glow_size = "medium"
intensity = "medium"
show_focus_border = true
# focus_ring = "#7fd3ff"  # keyboard focus-outline color; unset = accent shifted toward `foreground`
#                         # (auto-lighter on dark themes, darker on light); danger ring derives too
icon_secondary_alpha = 0.30
active_wash_alpha = 0.11
card_background_alpha = 0.02
shadow = { color = "#000000", alpha = 0.3, blur = 8.0 }
float_background = "#0c1820"
float_accent = "#afff5f"
float_focus = "#afff5f"
drag_ghost_bg = "#29b4fad9"
drag_ghost_fg = "#ffffff"
drag_source_bg = "#29b4fa26"
drag_source_border = "#29b4fa"
drop_target_bg = "#29b4fa2d"
drop_target_border = "#29b4fa"
drop_insertion = "#29b4fa"
sidebar_label_font_size = 14.0
sidebar_button_font_size = 11.0
