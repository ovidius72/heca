[package]
name = "heca-view"
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately dependency-free apart from serde: this crate is the one a plugin depends on to
# describe UI, so it must not drag in the widget library, the renderer or taffy (F003/P017/T009).
[dependencies]
serde = { version = "1", features = ["derive"] }

# Tests only: the round-trip guards assert the wire spelling of every kind and prop.
[dev-dependencies]
serde_json = "1"
