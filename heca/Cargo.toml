[package]
name = "heca"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
heca-core = { path = "../heca-core" }
heca-renderer = { path = "../heca-renderer" }
heca-config = { path = "../heca-config" }
heca-grid-ui = { path = "../heca-grid-ui" }
winit.workspace = true
wgpu = { workspace = true }
pollster = { workspace = true }

# OS backdrop blur / vibrancy (applied once after window creation, gated by
# [appearance] blur + vibrancy). macOS NSVisualEffectView / Windows acrylic.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.5"
