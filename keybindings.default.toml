# heca — Default Keybindings
# ===========================
# This file holds heca's DEFAULT keybindings (only the `[keys]` section). It is
# embedded into the binary and parsed at startup, so the bindings below are always
# valid and complete by construction. Non-keybinding settings live in a separate
# file: `config.default.toml`.
#
# To customize: copy this file to ~/.config/heca/keybindings.toml (Linux/macOS) or
# %APPDATA%\heca\keybindings.toml (Windows) and change only what you need. Your
# file is deep-merged over these defaults:
#   • flat bindings + [keys.unbind] merge per-key (override one, keep the rest);
#   • [[keys.command]] and [[keys.mode]] arrays REPLACE the default list wholesale
#     — re-list the defaults you still want, or rely on heca's built-in modes
#     (resize/sidebar/selection are always merged back in at runtime by name).
#
# Combo syntax:
#   "prefix+h"        → prefix key (Ctrl+B) then h
#   "prefix+Shift+q"  → prefix key then Shift+q
#   "prefix+Ctrl+h"   → prefix key then Ctrl+h
#   "Alt+Enter"       → global Alt+Enter (no prefix needed)
#   "Super+v"         → global Super+v (no prefix needed)
# Modifiers: Ctrl, Shift, Alt, Super (also accepts Win/Cmd).
# Named keys: Enter, Tab, Escape, Backspace, ArrowLeft/Right/Up/Down.

[keys]
# Prefix key triggers prefix mode for all `prefix+...` bindings (tmux-style).
prefix = "ctrl+b"

# ── Navigation (within workspace) ──
focus_left  = ["prefix+h", "prefix+ArrowLeft"]
focus_right = ["prefix+l", "prefix+ArrowRight"]
focus_up    = ["prefix+k", "prefix+ArrowUp"]
focus_down  = ["prefix+j", "prefix+ArrowDown"]

# ── Splits ──
split_horizontal = "prefix+Enter"   # New column to the right
split_vertical   = "prefix+v"       # New pane in current column
zoom_column      = "prefix+z"       # Toggle active column full-width
open_context_menu = "prefix+>"     # Open the focused pane's context menu (at the cursor)

# ── Horizontal view scroll (pan to reach off-screen / overflowing columns) ──
scroll_view_left  = "prefix+Shift+ArrowLeft"
scroll_view_right = "prefix+Shift+ArrowRight"

# ── Resize (column width / pane height) ──
resize_increase      = "prefix+="
resize_decrease      = "prefix+-"
pane_height_increase = "prefix+Shift+="
pane_height_decrease = "prefix+Shift+-"

# ── Font zoom ──
# Two explicit scopes (no implicit resolution): Ctrl = whole app (chrome/UI font
# AND every terminal pane), Ctrl+Shift = the focused terminal pane only, layered
# on top of the app-wide size. =/- zoom in/out; 0 resets. The same gesture is also
# on Ctrl/Meta+mouse-wheel, resolved by what's under the pointer (pane → pane,
# chrome → whole app).
# (Alt is deliberately avoided: on macOS the Option key rewrites the typed
#  character, so an Alt+= binding would never match.)
app_font_increase = "prefix+Ctrl+="        # Whole app (chrome + terminals) bigger
app_font_decrease = "prefix+Ctrl+-"        # Whole app (chrome + terminals) smaller
app_font_reset    = "prefix+Ctrl+0"        # Whole app back to configured sizes
pane_terminal_font_increase   = "prefix+Ctrl+Shift+="  # Focused pane font bigger
pane_terminal_font_decrease   = "prefix+Ctrl+Shift+-"  # Focused pane font smaller
pane_terminal_font_reset      = "prefix+Ctrl+Shift+0"  # Focused pane follows app-wide

# ── Pane operations ──
close = "prefix+x"   # Close active pane
delete_current_column = "prefix+Shift+x"  # Delete the focused pane's whole column
float = "prefix+f"   # Toggle pane floating

# ── Quick select / swap ──
pane_select         = "prefix+q"        # Letters on panes, pick to focus
follow_link         = "prefix+Shift+o"  # Letters on terminal links, pick to open
hint_pick           = "prefix+/"        # Letters on all actionable chrome targets, pick to activate
swap_pane           = "prefix+Shift+m"  # Letters, swap panes (stay here)
swap_and_focus_pane = "prefix+m"        # Letters, swap panes (follow)

# ── Move pane/column to a picked target (KeyHint overlay) ──
move_column_to_workspace_pick = "prefix+c"        # Move active column → picked workspace
move_pane_to_workspace_pick   = "prefix+g"        # Move active pane → picked workspace
move_pane_to_column_pick      = "prefix+Shift+c"  # Move active pane → picked column
pane_take                     = "prefix+t"        # Take target pane to bottom of active column
pane_take_and_focus           = "prefix+Shift+t"  # Take + focus the moved pane

# ── Pane cycling (within column) ──
next_pane = "prefix+]"
prev_pane = "prefix+["

# ── Sidebars ──
sidebar_left          = "prefix+b"    # Toggle left sidebar
sidebar_right         = "prefix+."    # Toggle right sidebar
sidebar_focus         = "prefix+e"    # Focus sidebar (enter nav mode)
sidebar_expand_toggle = "prefix+Tab"  # Expand/collapse selected sidebar node
# Sidebar-tree UI collapse state (works even when the sidebar is hidden):
toggle_current_workspace_collapsed = "prefix+<"
toggle_current_column_collapsed    = "prefix+("

# ── Chrome region show/hide (mounted-gate, sidebar-fu-6) ──
# A DISTINCT axis from `sidebar_left`/`sidebar_right` above (which expand/collapse to
# the rail): these fully MOUNT/UNMOUNT a region (zero width/height), the runtime twin
# of `[settings] show_left_sidebar/…`. Unbound by default — uncomment to bind. Each
# region has a show / hide / toggle action:
#   show_left_sidebar    hide_left_sidebar    toggle_left_sidebar
#   show_right_sidebar   hide_right_sidebar   toggle_right_sidebar
#   show_top_bar         hide_top_bar         toggle_top_bar
#   show_bottom_bar      hide_bottom_bar      toggle_bottom_bar
# Example:
# toggle_bottom_bar = "prefix+Ctrl+b"

# ── Workspace navigation ──
workspace_prev = ["prefix+u", "prefix+Ctrl+p"]
workspace_next = ["prefix+d", "prefix+Ctrl+n"]

# ── Focus toggle ──
focus_toggle_local  = "prefix+i"        # Toggle last pane (same workspace)
focus_toggle_global = "prefix+Shift+l"  # Toggle last pane (cross-workspace)

# ── Workspace / naming ──
create_workspace = "prefix+w"        # Create new workspace + pane
rename_workspace = "prefix+Shift+w"  # Rename workspace (active, or the sidebar cursor's in sidebar mode)
rename_pane      = "prefix+$"        # Rename pane (focused, or the sidebar cursor's in sidebar mode)
# `rename_column` has no default binding (prefix+Shift+c is reused for
# move-pane-to-column); the action stays available to bind manually.

# ── Move / swap (adjacent) ──
move_pane_left  = "prefix+Ctrl+["
move_pane_right = "prefix+Ctrl+]"
move_column_up   = "prefix+Ctrl+Shift+k"
move_column_down = "prefix+Ctrl+Shift+j"
swap_left  = "prefix+Ctrl+h"
swap_right = "prefix+Ctrl+l"
swap_up    = "prefix+Ctrl+k"
swap_down  = "prefix+Ctrl+j"

# ── System ──
command_palette = "prefix+p"        # Open command palette
reload_config   = "prefix+Shift+r"  # Reload config at runtime

# ── Widget navigation & editing (widget-keys-config) ──
# The generic, cross-widget vocabulary lives in the [keys.widgets] table near the end of this
# file (item_next/item_previous, menu_up/menu_down, activate/dismiss, edit_*).

# ── Selection (host capability, reusable across pane types) ──
enter_selection_mode = "prefix+s"        # Enter selection mode (caret-only)
clear_selection      = "prefix+Shift+s"  # Clear selection; exit selection mode
copy_selection       = "prefix+y"        # Copy selection to clipboard
# Paste: Super+V (macOS Cmd+V), Ctrl+Shift+V (Linux/Windows), plus a prefix combo.
paste_clipboard      = ["Super+v", "Ctrl+Shift+v", "prefix+Shift+p"]

# ── Scrollback (host terminal viewport) ──
# All scrollback navigation lives inside Selection mode (entered via prefix+s):
#   j/k/arrows    move caret (auto-scrolls at edges)
#   u/d           half-page up/down
#   Ctrl+u/d      full page up/down
#   g / Shift+g   top / bottom
#   y             copy selection
#   v / Space     begin selection
#   o             flip selection endpoint
#   Shift+o       open the link under the caret
#   /             search the scrollback (type query; Enter keeps, Esc cancels)
#   n / Shift+n   jump to next / previous search match
#   Esc           exit
# (Wheel-up at a non-grabbed prompt also enters Selection mode — Q3.)

# Direct (non-prefix) bindings for users who don't use prefix mode
# for scrollback navigation. These scroll immediately and do NOT enter
# Selection mode (repeatable via key-hold).
scroll_page_up     = "Shift+PageUp"
scroll_page_down   = "Shift+PageDown"
scroll_to_top      = "Shift+Home"
scroll_to_bottom   = "Shift+End"
scroll_line_up     = "Shift+Up"
scroll_line_down   = "Shift+Down"
# GUI/RPC-only by default (used by the terminal scrollbar): no flat keybinding
# form supports args yet, but the action is still configurable in custom modes.
# Example fixed jump in a user-defined mode:
# [[keys.mode]]
# name = "scroll-jump"
# trigger = "prefix+Shift+j"
# sticky = false
# [[keys.mode.bindings]]
# action = "scroll_to_offset"
# keys = "1"
# args = { rows = "200" }

# Remove a default binding so its key is free (the action stays available to
# rebind under [keys]). Unbinding is keyed by the KEY, so it retires a binding
# whatever it points at — a built-in action or a plugin action id. Example:
# [keys.unbind]
# "prefix+f" = true

# ── Binding a PLUGIN / PROVIDER action (dynamic action ids) ──
# An action name is not limited to heca's built-in actions: it can be the stable
# string id of an action registered at runtime by a provider or a plugin, e.g.
# `plugin.docker.restart` or `chrome.container.move_to_region`.
#
# These ids resolve at PRESS time, not at load. heca reads your config BEFORE any
# provider or plugin has registered its actions, so a binding to an id that does
# not exist yet is NOT an error — it simply does nothing until the action shows
# up. (The flip side: a TYPO in an action name is not an error either; it just
# never fires. Check the name if a binding seems dead.)
#
# Flat form (no args):
# [keys]
# "prefix+d" = "plugin.docker.restart"
#
# With args — use a custom mode binding, which supports `args`:
# [[keys.mode]]
# name = "docker"
# trigger = "prefix+Shift+d"
# sticky = false
# [[keys.mode.bindings]]
# action = "plugin.docker.restart"
# keys = "w"
# args = { container = "web" }

# ── Chrome container placement (built-in, dotted ids) ──
# heca's own container-placement actions use the same dotted id scheme, so you can
# move a chrome container (the workspaces tree, and later plugin-provided ones)
# between regions from a key, a menu, or RPC. They take args, so bind them in a
# custom mode:
#   chrome.container.move_to_region      args: container_id, region
#   chrome.container.move_left_sidebar   args: container_id
#   chrome.container.move_right_sidebar  args: container_id
#   chrome.container.reorder_before      args: container_id, before_id (optional —
#                                              omit to move it to the end)
#   chrome.container.reorder_after       args: container_id, after_id
# region ∈ left-sidebar | right-sidebar | top-bar | bottom-bar
#          (short forms left | right | top | bottom also work)
#
# [[keys.mode]]
# name = "chrome"
# trigger = "prefix+Shift+m"
# sticky = false
# [[keys.mode.bindings]]
# action = "chrome.container.move_right_sidebar"
# keys = "l"
# args = { container_id = "workspaces" }
# [[keys.mode.bindings]]
# action = "chrome.container.move_left_sidebar"
# keys = "h"
# args = { container_id = "workspaces" }

# Launch a program on a key. `kind = "terminal"` runs it inside a pane;
# `float = true` opens it floating; `close_pane = true` closes the pane on exit;
# `keep_on_error` / `keep_on_success` keep the pane open after the program ends.
# NOTE: defining ANY [[keys.command]] in your config replaces this whole list.
# [[keys.command]]
# keys = "prefix+g"
# command = "lazygit"
# float = true
# close_pane = true
#
# [[keys.command]]
# keys = "Alt+Enter"
# command = "alacritty"
# kind = "terminal"

# ─────────────────────────────────────────────────────────────────────────────
# Widget navigation & editing — [keys.widgets]  (widget-keys-config)
# ─────────────────────────────────────────────────────────────────────────────
# One generic, cross-widget vocabulary for every interactive widget/overlay — the context
# menu, command palette, Select lists, Tabs, and Dialog focus. Applies ONLY while such a
# widget/overlay is focused (never hijacks normal-mode input). Split by AXIS:
#   • item_previous / item_next  — HORIZONTAL (left/right): Tabs, a dialog's button row.
#   • menu_up / menu_down        — VERTICAL (up/down): menus, Select lists, the palette.
#   • activate / dismiss         — shared (commit/submit, close/cancel).
#   • edit_*                     — text-Input shortcuts (plain typing/caret keys are built in).
# Tab / Shift+Tab are NOT here: they are the universal, always-on focus-traversal primitive
# handled by the focus system (and trapped inside a modal dialog), not a rebindable binding.
# A focused text field keeps its own keys first (field-first): e.g. ← moves the caret inside an
# Input but navigates when a button is focused; Ctrl+h deletes in an Input but is item_previous
# on a Tabs/dialog — the same key disambiguates by which widget has focus.
[keys.widgets]
item_previous = ["ArrowLeft", "Ctrl+h"]   # Horizontal previous (left) — vim Ctrl+h
item_next     = ["ArrowRight", "Ctrl+l"]   # Horizontal next (right) — vim Ctrl+l
menu_up       = ["ArrowUp", "Ctrl+k"]      # Vertical up / previous — vim Ctrl+k
menu_down     = ["ArrowDown", "Ctrl+j"]    # Vertical down / next — vim Ctrl+j
activate      = ["Enter", "Space"]          # Commit / submit the selected entry or primary action
dismiss       = "Escape"                    # Close / cancel the overlay
edit_delete_back          = "Ctrl+h"                 # Input: delete one char before the caret
edit_delete_to_line_start = "Ctrl+u"                 # Input: delete from the caret to line start
edit_select_all           = ["Ctrl+a", "Super+a"]    # Input: select the whole field (Cmd+a on macOS)

# ─────────────────────────────────────────────────────────────────────────────
# Custom modes — [[keys.mode]]
# ─────────────────────────────────────────────────────────────────────────────
# A mode is a sub-keymap entered via a trigger; `sticky = true` stays active until
# Esc. The three modes below (resize, sidebar, selection) are heca's built-ins.
# heca always merges these built-ins back in at runtime BY NAME, so redefining one
# only extends/overrides its bindings — you will not lose sidebar/selection
# navigation by adding your own mode.

# ── resize ── (prefix+r → sticky resize mode)
[[keys.mode]]
name = "resize"
trigger = "prefix+r"
sticky = true
[[keys.mode.bindings]]
action = "resize"
keys = "h"
args = { target = "column", axis = "x", amount = "-50" }
[[keys.mode.bindings]]
action = "resize"
keys = "l"
args = { target = "column", axis = "x", amount = "50" }
[[keys.mode.bindings]]
action = "resize"
keys = "j"
args = { target = "pane", axis = "y", amount = "-40" }
[[keys.mode.bindings]]
action = "resize"
keys = "k"
args = { target = "pane", axis = "y", amount = "40" }
[[keys.mode.bindings]]
action = "resize"
keys = "Left"
args = { target = "column", axis = "x", amount = "-50" }
[[keys.mode.bindings]]
action = "resize"
keys = "Right"
args = { target = "column", axis = "x", amount = "50" }
[[keys.mode.bindings]]
action = "resize"
keys = "Down"
args = { target = "pane", axis = "y", amount = "-40" }
[[keys.mode.bindings]]
action = "resize"
keys = "Up"
args = { target = "pane", axis = "y", amount = "40" }

# ── sidebar ── (entered via sidebar_focus / mouse; no trigger of its own)
[[keys.mode]]
name = "sidebar"
trigger = ""
sticky = true
[[keys.mode.bindings]]
action = "sidebar_up"
keys = "k"
[[keys.mode.bindings]]
action = "sidebar_down"
keys = "j"
[[keys.mode.bindings]]
action = "sidebar_up"
keys = "Up"
[[keys.mode.bindings]]
action = "sidebar_down"
keys = "Down"
[[keys.mode.bindings]]
action = "sidebar_up"
keys = "ArrowUp"
[[keys.mode.bindings]]
action = "sidebar_down"
keys = "ArrowDown"
[[keys.mode.bindings]]
action = "sidebar_left_nav"
keys = "h"
[[keys.mode.bindings]]
action = "sidebar_right_nav"
keys = "l"
[[keys.mode.bindings]]
action = "sidebar_left_nav"
keys = "Left"
[[keys.mode.bindings]]
action = "sidebar_right_nav"
keys = "Right"
[[keys.mode.bindings]]
action = "sidebar_left_nav"
keys = "ArrowLeft"
[[keys.mode.bindings]]
action = "sidebar_right_nav"
keys = "ArrowRight"
[[keys.mode.bindings]]
action = "sidebar_create_workspace"
keys = "w"
[[keys.mode.bindings]]
action = "sidebar_create_column"
keys = "c"
[[keys.mode.bindings]]
action = "sidebar_split_in_column"
keys = "v"
[[keys.mode.bindings]]
action = "sidebar_zoom_selected_column"
keys = "z"
[[keys.mode.bindings]]
action = "sidebar_delete_selected"
keys = "d"
[[keys.mode.bindings]]
# Delete the selected item's whole column (the cursor never lands on a column
# itself, so `d` above can only reach a pane/workspace). Shift+d, kept distinct
# from `d` — a bare "D" folds to "d" in the keymap, so the Shift+ prefix is required.
action = "delete_current_column"
keys = "Shift+d"
[[keys.mode.bindings]]
action = "sidebar_expand_toggle"
keys = "Tab"
[[keys.mode.bindings]]
# Focus the selected pane/workspace but STAY in sidebar mode, so the tree can be
# walked with j/k while each row is previewed in the main view. `l`/`Right` focus
# and *leave*; this is the one that keeps you here.
action = "sidebar_peek"
keys = "Space"
[[keys.mode.bindings]]
action = "sidebar_left"
keys = "b"

# ── selection ── (entered via enter_selection_mode; no trigger of its own)
[[keys.mode]]
name = "selection"
trigger = ""
sticky = true
[[keys.mode.bindings]]
action = "selection_left"
keys = "h"
[[keys.mode.bindings]]
action = "selection_right"
keys = "l"
[[keys.mode.bindings]]
action = "selection_up"
keys = "k"
[[keys.mode.bindings]]
action = "selection_down"
keys = "j"
[[keys.mode.bindings]]
action = "selection_left"
keys = "ArrowLeft"
[[keys.mode.bindings]]
action = "selection_right"
keys = "ArrowRight"
[[keys.mode.bindings]]
action = "selection_up"
keys = "ArrowUp"
[[keys.mode.bindings]]
action = "selection_down"
keys = "ArrowDown"
[[keys.mode.bindings]]
action = "scrollback_page_up"
keys = "PageUp"
[[keys.mode.bindings]]
action = "scrollback_page_down"
keys = "PageDown"
[[keys.mode.bindings]]
action = "copy_selection"
keys = "y"
[[keys.mode.bindings]]
action = "begin_selection"
keys = "v"
[[keys.mode.bindings]]
action = "begin_selection"
keys = "Space"
[[keys.mode.bindings]]
action = "toggle_selection_endpoint"
keys = "o"
[[keys.mode.bindings]]
action = "open_link_at_caret"
keys = "Shift+o"
[[keys.mode.bindings]]
action = "search_scrollback"
keys = "/"
[[keys.mode.bindings]]
action = "search_next_match"
keys = "n"
[[keys.mode.bindings]]
action = "search_prev_match"
keys = "Shift+n"

# Scrollback bindings within selection mode (copy-mode style):
# u/d = half-page, Ctrl+u/d = full page, g/G = top/bottom, Esc = exit.
[[keys.mode.bindings]]
action = "scrollback_line_up"
keys = "u"
args = { amount = "12" }
[[keys.mode.bindings]]
action = "scrollback_line_down"
keys = "d"
args = { amount = "12" }
[[keys.mode.bindings]]
action = "scrollback_page_up"
keys = "Ctrl+u"
[[keys.mode.bindings]]
action = "scrollback_page_down"
keys = "Ctrl+d"
[[keys.mode.bindings]]
action = "scrollback_to_top"
keys = "g"
[[keys.mode.bindings]]
action = "scrollback_to_top"
keys = "Home"
[[keys.mode.bindings]]
action = "scrollback_to_bottom"
keys = "Shift+g"
[[keys.mode.bindings]]
action = "scrollback_to_bottom"
keys = "End"
[[keys.mode.bindings]]
action = "exit_scrollback"
keys = "Escape"

# ── Font size modes (sticky) ──
# Enter the mode once, then tap keys repeatedly without re-pressing the chord:
#   k / ArrowUp = bigger,  j / ArrowDown = smaller,  0 = reset,  Esc/Enter = exit.
# `app_font_size` scales the WHOLE app (chrome + every terminal); `pane_font_size`
# scales only the focused terminal pane. The direct chords still work too
# (prefix+Ctrl+=/-/0 whole app, prefix+Ctrl+Shift+=/-/0 focused pane).
[[keys.mode]]
name = "app_font_size"
trigger = "prefix+!"   # prefix then Shift+1
sticky = true
[[keys.mode.bindings]]
action = "app_font_increase"
keys = "k"
[[keys.mode.bindings]]
action = "app_font_increase"
keys = "ArrowUp"
[[keys.mode.bindings]]
action = "app_font_decrease"
keys = "j"
[[keys.mode.bindings]]
action = "app_font_decrease"
keys = "ArrowDown"
[[keys.mode.bindings]]
action = "app_font_reset"
keys = "0"

[[keys.mode]]
name = "pane_font_size"
trigger = "prefix+@"   # prefix then Shift+2
sticky = true
[[keys.mode.bindings]]
action = "pane_terminal_font_increase"
keys = "k"
[[keys.mode.bindings]]
action = "pane_terminal_font_increase"
keys = "ArrowUp"
[[keys.mode.bindings]]
action = "pane_terminal_font_decrease"
keys = "j"
[[keys.mode.bindings]]
action = "pane_terminal_font_decrease"
keys = "ArrowDown"
[[keys.mode.bindings]]
action = "pane_terminal_font_reset"
keys = "0"
