# Scrollback bindings within selection mode (copy-mode style):
# u/d = half-page, Ctrl+u/d = full page, g/G = top/bottom, Esc = exit.
[[keys.mode.bindings]]
action = "scrollback_line_up"
keys = "u"
args = { amount = "12" }
[[keys.mode.bindings]]
action = "scrollback_line_down"
keys = "d"
args = { amount = "12" }
[[keys.mode.bindings]]
action = "scrollback_page_up"
keys = "Ctrl+u"
[[keys.mode.bindings]]
action = "scrollback_page_down"
keys = "Ctrl+d"
[[keys.mode.bindings]]
action = "scrollback_to_top"
keys = "g"
[[keys.mode.bindings]]
action = "scrollback_to_top"
keys = "Home"
[[keys.mode.bindings]]
action = "scrollback_to_bottom"
keys = "Shift+g"
[[keys.mode.bindings]]
action = "scrollback_to_bottom"
keys = "End"
[[keys.mode.bindings]]
action = "exit_scrollback"
keys = "Escape"

# ── Font size modes (sticky) ──
# Enter the mode once, then tap keys repeatedly without re-pressing the chord:
#   k / ArrowUp = bigger,  j / ArrowDown = smaller,  0 = reset,  Esc/Enter = exit.
# `app_font_size` scales the WHOLE app (chrome + every terminal); `pane_font_size`
# scales only the focused terminal pane. The direct chords still work too
# (prefix+Ctrl+=/-/0 whole app, prefix+Ctrl+Shift+=/-/0 focused pane).
[[keys.mode]]
name = "app_font_size"
trigger = "prefix+!"   # prefix then Shift+1
sticky = true
[[keys.mode.bindings]]
action = "app_font_increase"
keys = "k"
[[keys.mode.bindings]]
action = "app_font_increase"
keys = "ArrowUp"
[[keys.mode.bindings]]
action = "app_font_decrease"
keys = "j"
[[keys.mode.bindings]]
action = "app_font_decrease"
keys = "ArrowDown"
[[keys.mode.bindings]]
action = "app_font_reset"
keys = "0"

[[keys.mode]]
name = "pane_font_size"
trigger = "prefix+@"   # prefix then Shift+2
sticky = true
[[keys.mode.bindings]]
action = "pane_terminal_font_increase"
keys = "k"
[[keys.mode.bindings]]
action = "pane_terminal_font_increase"
keys = "ArrowUp"
[[keys.mode.bindings]]
action = "pane_terminal_font_decrease"
keys = "j"
[[keys.mode.bindings]]
action = "pane_terminal_font_decrease"
keys = "ArrowDown"
[[keys.mode.bindings]]
action = "pane_terminal_font_reset"
keys = "0"

# ═══════════════════════════════════════════════════════════════════════════════
#  Component keys — [[keys.component]]  (F003/P086/T362)
# ═══════════════════════════════════════════════════════════════════════════════
# heca's own components ship their keys HERE rather than in their code, so there is exactly one
# place a key is written and one place to change it. See the block near the top for the shape.
# These apply only while the component holds chrome focus; `prefix+Shift+e` picks a dock.

[[keys.component]]
name              = "workspaces"
cursor_up         = "k,Up,ArrowUp"
cursor_down       = "j,Down,ArrowDown"
collapse_row      = "h,Left,ArrowLeft"
activate_selected = "l,Right,ArrowRight,Enter"
peek_selected     = "Space"
toggle_selected   = "Tab"
