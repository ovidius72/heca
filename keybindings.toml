# heca Keybindings Reference
# ===========================
# This file documents ALL configurable keybindings in heca.
# Copy sections into your ~/.config/heca/config.toml to customize.
#
# Syntax:
#   action_name = "combo"                    # Single binding
#   action_name = ["combo1", "combo2"]       # Multiple bindings
#
# Planned richer syntax (implementation contract):
#   [[keys.bind]]
#   keys = "prefix+g"
#   action = "spawn_pane"
#   args = { kind = "terminal", program = "nvim", argv = ["."], float = true, width = "80%", height = "80%" }
#
# Combo syntax:
#   "prefix+h"        → prefix key (Ctrl+B) then h
#   "prefix+Shift+q"  → prefix key then Shift+q
#   "prefix+Ctrl+h"   → prefix key then Ctrl+h
#   "Alt+Enter"       → global Alt+Enter (no prefix needed)
#   "Super+t"         → global Super+t (no prefix needed)
#   "F1"              → global F1 key
#
# Available modifiers: Ctrl, Shift, Alt, Super (also accepts Win/Cmd)
# Named keys: Enter, Tab, Escape, Backspace, ArrowLeft, ArrowRight, ArrowUp, ArrowDown

# -----------------------------------------------------------------------------
# Prefix Key
# -----------------------------------------------------------------------------
# The prefix key triggers prefix mode. All prefix bindings start with "prefix+".
# Default: "ctrl+b"
# prefix = "ctrl+a"

# -----------------------------------------------------------------------------
# Settings ([settings] in config.toml — not under [keys])
# -----------------------------------------------------------------------------
# shell_integration = true    # Auto-inject shell hooks that emit OSC 133/OSC 7
#                             # for per-command status and cwd updates. Disable
#                             # to spawn a bare shell; the generated snippets
#                             # live under ~/.config/heca/runtime/shell-integration/.

# -----------------------------------------------------------------------------
# Appearance settings  ([appearance] in config.toml — not under [keys])
# -----------------------------------------------------------------------------
# A config override takes precedence; `None` inherits from the theme. Three
# pane-chrome values are clamped to a safe range (marked CAP below) so the
# rounded content-clip stays gentle and terminal content isn't cut off at the
# borders.
#
# Window / chrome transparency + blur (each 0..=100, default 0):
#   transparency           = 0    # Window background opacity  (0 = opaque, 100 = see-through)
#   blur                   = 0    # Window backdrop blur (portable GPU pass; 0 = none)
#
# Terminal-pane transparency + frost (independent of the window ones):
#   terminal_transparency = 0    # Terminal surface opacity   (0 = opaque, 100 = see-through)
#   terminal_blur          = 0    # Frosted-glass tint strength behind the terminal (0 = none,
#                                #   100 = full frost). Perceptual sqrt curve so low values show
#                                #   visible frost sooner (10 → ~32%, 50 → ~71%). heca can't blur
#                                #   the desktop (macOS vibrancy composites it behind the window),
#                                #   so terminal_blur drives a frosted TINT over the vibrancy
#                                #   instead of a real blur of an empty scene.
#   terminal_frost_color   = "#1e1e2e"  # Optional. Frosted tint color. Default: theme
#                                #   background (the app theme bg). Set to a lifted surface
#                                #   (e.g. "#313244") for a lighter frosted-glass look.
#
# Floating-pane transparency + frost + border (independent of the tiled ones;
# floating panes default to OPAQUE + no frost so they stay readable):
#   terminal_floating_transparency = 0    # Floating terminal surface opacity (0 = opaque, 100 = see-through).
#                                          #   Default 0 (opaque) — floating panes are solid, readable windows.
#   terminal_floating_blur          = 0    # Floating frosted-tint strength (0 = none, 100 = full frost, sqrt curve).
#                                          #   Default 0 (no frost). Set > 0 to frost floating panes too.
#   pane_floating_border_color     = "#89b4fa"  # Optional. Floating pane border color (all floating panes).
#                                          #   Default: theme.float_accent. Set to distinguish floating panes.
#
# OS backdrop material (platform-dependent; default "none"):
#   vibrancy = "under_window_background"
#     # one of: none | sidebar | hud_window | under_window_background |
#     #         popover | menu | full_screen_ui | window_background
#
# Pane chrome (Option<f32> / Option<Color>; None → theme):
#   pane_border_width        = 2.0       # CAP [0, 10]. Default: theme.border_width (mocha: 1.0).
#   pane_border_radius       = 20.0      # CAP [0, 20]. Default: theme.border_radius (mocha: 6.0).
#                                        # Capped at 20: higher radii carve into terminal cells at the corners.
#   pane_padding             = 4.0       # CAP [0, 20]. Default: 4.0 (snug — the rounded clip handles corners).
#   pane_border_color        = "#313244" # Default: theme.border at 50% alpha (inactive/unfocused panes).
#   pane_active_border_color = "#89b4fa" # Default: theme.accent (focused pane).
#   pane_floating_border_color = "#89b4fa" # Optional. Default: theme.float_accent (all floating panes).
#   pane_gap                 = 8.0       # Default: 8.0 (gap between panes).
#   sidebar_gap              = 12.0      # Default: 12.0 (gap between sidebar and content area).

# -----------------------------------------------------------------------------
# Navigation (within workspace)
# -----------------------------------------------------------------------------
focus_left  = ["prefix+h", "prefix+ArrowLeft"]    # Focus column left (animated scroll)
focus_right = ["prefix+l", "prefix+ArrowRight"]   # Focus column right (animated scroll)
focus_up    = ["prefix+k", "prefix+ArrowUp"]       # Focus pane up within column
focus_down  = ["prefix+j", "prefix+ArrowDown"]     # Focus pane down within column

# -----------------------------------------------------------------------------
# Splits
# -----------------------------------------------------------------------------
split_horizontal = "prefix+Enter"   # New column to the right
split_vertical   = "prefix+v"       # New pane in current column

# -----------------------------------------------------------------------------
# Resize (column width / pane height)
# -----------------------------------------------------------------------------
resize_increase      = "prefix+="       # Widen active column
resize_decrease      = "prefix+-"       # Narrow active column
pane_height_increase = "prefix+Shift+=" # Grow active pane height
pane_height_decrease = "prefix+Shift+-" # Shrink active pane height

# -----------------------------------------------------------------------------
# Pane Operations
# -----------------------------------------------------------------------------
close = "prefix+x"   # Close active pane
float = "prefix+f"   # Toggle pane floating (detach/attach)
zoom_column = "prefix+z"  # Toggle active column full-width / restore previous width

# -----------------------------------------------------------------------------
# Quick Select / Swap
# -----------------------------------------------------------------------------
pane_select         = "prefix+q"        # Show letters on panes, pick to focus
swap_pane           = "prefix+Shift+q"  # Show letters, swap panes (stay here)
swap_and_focus_pane = "prefix+m"        # Show letters, swap panes (follow)

# -----------------------------------------------------------------------------
# Pane Cycling (within column)
# -----------------------------------------------------------------------------
next_pane = "prefix+]"   # Next pane in column
prev_pane = "prefix+["   # Previous pane in column

# -----------------------------------------------------------------------------
# Sidebars
# -----------------------------------------------------------------------------
sidebar_left         = "prefix+b"    # Toggle left sidebar
sidebar_right        = "prefix+."    # Toggle right sidebar
sidebar_focus        = "prefix+e"    # Focus sidebar (enter nav mode)
sidebar_expand_toggle = "prefix+Tab" # Expand/collapse selected sidebar node
# Global sidebar-tree UI collapse state (works even if sidebar is hidden)
# These affect tree UI state only, not compositor/layout visibility.
# The current workspace/column are taken from active main-view state.
# These are also configurable from config.toml.
toggle_current_workspace_collapsed = "prefix+<"
toggle_current_column_collapsed    = "prefix+("

# Sidebar-only mutation keys (active only in SidebarNav):
#   w = create workspace
#   c = create column in selected workspace context
#   v = split/add pane in selected column context
#   z = zoom selected column
#   d = delete selected item with confirmation
#
# Sidebar navigation (only active IN sidebar mode):
#   The defaults below come from [[keys.mode]] name = "sidebar".
#   Override them in config.toml by redefining that mode's bindings.
#   Use the real config shape:
#   [[keys.mode]]
#   name = "sidebar"
#   sticky = true
#   [[keys.mode.bindings]]
#   action = "sidebar_up"
#   keys = "u"
#   h / l              → collapse / expand tree node
#   Left / Right       → collapse / expand tree node
#   j / k              → move cursor down / up
#   Up / Down          → move cursor down / up
#   Space              → focus/select pane on leaf rows; otherwise acts like Right
#   Tab                → toggle collapse of the selected row
#   w / c / v / z / d  → sidebar-only mutation keys (workspace, column, split, zoom, delete)
#   b                  → toggle the left sidebar
#   Enter              → activate selected item
#   Escape             → exit sidebar mode

# -----------------------------------------------------------------------------
# Workspace Navigation
# -----------------------------------------------------------------------------
workspace_prev = ["prefix+u", "prefix+Ctrl+p"]   # Previous workspace
workspace_next = ["prefix+d", "prefix+Ctrl+n"]   # Next workspace

# Focus workspace by number (chord: prefix → w → digit)
# prefix+w, then 1-9 → focus workspace 1-9

# -----------------------------------------------------------------------------
# Focus Toggle
# -----------------------------------------------------------------------------
focus_toggle_local  = "prefix+i"        # Toggle last pane (same workspace)
focus_toggle_global = "prefix+Shift+l"  # Toggle last pane (cross-workspace)

# -----------------------------------------------------------------------------
# Workspace Management
# -----------------------------------------------------------------------------
create_workspace  = "prefix+w"        # Create new workspace + pane
rename_workspace  = "prefix+Shift+w"  # Rename current workspace
rename_column     = "prefix+Shift+c"  # Rename active column
rename_pane       = "prefix+$"        # Rename current pane/tab

# -----------------------------------------------------------------------------
# Move / Swap (adjacent)
# -----------------------------------------------------------------------------
move_pane_left  = "prefix+Ctrl+["
move_pane_right = "prefix+Ctrl+]"
swap_left       = "prefix+Ctrl+h"
swap_right      = "prefix+Ctrl+l"
swap_up         = "prefix+Ctrl+k"
swap_down       = "prefix+Ctrl+j"

# -----------------------------------------------------------------------------
# System
# -----------------------------------------------------------------------------
command_palette = "prefix+p"        # Open command palette (backend ready)
reload_config   = "prefix+Shift+r"  # Reload config at runtime

# -----------------------------------------------------------------------------
# Selection (host capability, reusable across pane types)
# -----------------------------------------------------------------------------
# Selection is a host-level capability, not a terminal-only feature.
# Entering selection mode places a caret at the terminal cursor; the user
# then explicitly begins selection with v or Space and grows it with
# movement keys. o flips which end is active so both ends can be adjusted.
# y copies without leaving the mode; Esc clears and exits.
enter_selection_mode = "prefix+s"        # Enter selection mode (caret-only, no selection)
clear_selection      = "prefix+Shift+s"  # Clear the active selection; exit selection mode
copy_selection       = "prefix+y"        # Copy selected text to system clipboard (also y in selection mode)
# paste_clipboard    = <no default>      # Bind in your config if you want a default for paste
begin_selection      = <selection-mode-only>  # Start selection from caret (keys: v, Space)
toggle_selection_endpoint = <selection-mode-only>  # Swap active endpoint (key: o)
#
# Built-in selection mode default bindings:
#   h / ArrowLeft   -> selection_left    (move caret before selection, grow selection after)
#   l / ArrowRight  -> selection_right
#   k / ArrowUp     -> selection_up
#   j / ArrowDown   -> selection_down
#   v / Space      -> begin_selection    (start selection from caret position)
#   o              -> toggle_selection_endpoint (swap which end moves)
#   y              -> copy_selection    (copies, stays in selection mode)

# -----------------------------------------------------------------------------
# Custom Modes
# -----------------------------------------------------------------------------
# Modes are groups of bindings active until Esc/Enter is pressed.
# Define modes under [[keys.mode]]:
#
# [[keys.mode]]
# name = "resize"
# trigger = "prefix+r"
# sticky = true
#
# [[keys.mode.bindings]]
# action = "resize"
# keys = "h"
# args = { target = "column", axis = "x", amount = "-50" }
#
# [[keys.mode.bindings]]
# action = "resize"
# keys = "l"
# args = { target = "column", axis = "x", amount = "50" }
#
# Planned richer mode examples:
#
# [[keys.mode]]
# name = "spawn"
# trigger = "prefix+s"
# sticky = true
#
# [[keys.mode.bindings]]
# action = "spawn_pane"
# keys = "g"
# args = { kind = "terminal", program = "lazygit", argv = [] }
#
# [[keys.mode.bindings]]
# action = "spawn_pane"
# keys = "t"
# args = { kind = "terminal", program = "btm", argv = [], float = true, width = "800", height = "400" }
#
# [[keys.mode.bindings]]
# action = "spawn_pane"
# keys = "y"
# args = { kind = "terminal", program = "htop", argv = [], float = true, width = "800px", height = "400px" }
#
# [[keys.mode.bindings]]
# action = "spawn_pane"
# keys = "n"
# args = { kind = "terminal", program = "nvim", argv = ["."], float = true, width = "80%", height = "80%" }
#
# [[keys.mode.bindings]]
# action = "spawn_pane"
# keys = "b"
# args = { kind = "browser", float = true, width = "1200", height = "800" }
#
# [[keys.mode.bindings]]
# action = "spawn_pane"
# keys = "v"
# args = { kind = "nvim_gui", float = true, width = "1000", height = "700" }
#
# [[keys.mode.bindings]]
# action = "float_active_at"
# keys = "f"
# args = { width = "95%", height = "95%" }
#
# [[keys.mode.bindings]]
# action = "zoom_column"
# keys = "z"

# -----------------------------------------------------------------------------
# Spawn Commands / Planned SpawnPane
# -----------------------------------------------------------------------------
# Launch external applications in new panes today:
#
# [[keys.command]]
# keys = "prefix+g"
# command = "lazygit"
# float = true
# close_pane = true
#
# [[keys.command]]
# keys = "Alt+Enter"
# command = "alacritty"
# kind = "terminal"
#
# Program presentation overrides used by pane chrome:
#
# [programs.nvim]
# name = "Neovim"
# icon = "\uE7C4"
# color = "#89b4fa"
#
# Unknown programs fall back to their raw name and the default terminal icon.
#
# Planned richer parameterized bindings for normal mode:
#
# zoom toggle
# [[keys.bind]]
# keys = "prefix+z"
# action = "zoom_column"
#
# tiled terminal spawn
# [[keys.bind]]
# keys = "prefix+g"
# action = "spawn_pane"
# args = { kind = "terminal", program = "lazygit", argv = [] }
#
# floating terminal spawn with implicit px values
# [[keys.bind]]
# keys = "prefix+Shift+t"
# action = "spawn_pane"
# args = { kind = "terminal", program = "btm", argv = [], float = true, width = "800", height = "400" }
#
# floating terminal spawn with explicit px suffix
# [[keys.bind]]
# keys = "prefix+Shift+y"
# action = "spawn_pane"
# args = { kind = "terminal", program = "htop", argv = [], float = true, width = "800px", height = "400px" }
#
# floating terminal spawn with percent sizing
# [[keys.bind]]
# keys = "prefix+Shift+g"
# action = "spawn_pane"
# args = { kind = "terminal", program = "nvim", argv = ["."], float = true, width = "80%", height = "80%" }
#
# floating browser spawn
# [[keys.bind]]
# keys = "prefix+Shift+b"
# action = "spawn_pane"
# args = { kind = "browser", float = true, width = "1200", height = "800" }
#
# floating nvim_gui spawn
# [[keys.bind]]
# keys = "prefix+Shift+n"
# action = "spawn_pane"
# args = { kind = "nvim_gui", float = true, width = "1000", height = "700" }
#
# float geometry helper
# [[keys.bind]]
# keys = "prefix+Shift+f"
# action = "float_active_at"
# args = { width = "95%", height = "95%" }
#
# Size parsing contract for the planned implementation:
#   width = "800"    -> 800px
#   width = "800px"  -> explicit px
#   width = "80%"    -> percent of available content area
#
# Floating behavior contract:
#   - float = true opens centered by default
#   - prefix+f remains float/unfloat
#   - originally tiled panes restore to their old slot when un-floated
#   - born-floating panes unfloat into a new column

# -----------------------------------------------------------------------------
# Unbind (remove default bindings)
# -----------------------------------------------------------------------------
# To remove a default binding, add it to [keys.unbind].
# The action still exists — you can rebind it to a different key in [keys].
#
# Example:
#   [keys.unbind]
#   "prefix+f" = true        # Remove default float toggle (prefix+f)
#   "prefix+q" = true        # Remove default pane select (prefix+q)
#
# Then rebind to different keys:
#   [keys]
#   float      = "prefix+Shift+f"   # Float is now prefix+Shift+f
#   pane_select = "prefix+Shift+q"  # Pane select is now prefix+Shift+q
#
# Why unbind?
#   - Free up keys for custom bindings
#   - Disable features you don't use
#   - Resolve conflicts between defaults and custom bindings

# Example unbind section (uncomment to use):
# [keys.unbind]
# "prefix+f" = true
# "prefix+q" = true
# "prefix+Shift+q" = true
